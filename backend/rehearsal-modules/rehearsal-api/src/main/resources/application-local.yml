rehearsal:
  security:
    api-key:
      enabled: false
  # application.yml 기본값이 빈 맵이라 local profile엔 옷 후보가 하나도 없었다 —
  # /outfits가 항상 404가 나서 로컬에서 옷 입히기 화면을 확인할 수 없었다.
  # prod와 동일한 CloudFront 공개 이미지를 그대로 가져와 채운다(시크릿 아님).
  decart:
    outfits:
      suit:
        label: "네이비 정장"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/suit.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/suit.png"
        prompt: "네이비 컬러의 정장 재킷, 구조적인 어깨라인, 격식 있는 슬림핏"
        situation-types: []
        outfit-direction: ""
        default-outfit: true
        enhance: true
      gray_shirt:
        label: "그레이 셔츠"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/gray_shirt.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/gray_shirt.png"
        prompt: "그레이 컬러의 캐주얼 셔츠, 단정하면서 편안한 핏"
        situation-types: []
        outfit-direction: ""
        default-outfit: false
        enhance: true
      cream_knit:
        label: "크림 니트"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/cream_knit.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/cream_knit.png"
        prompt: "크림색 니트 스웨터, 부드러운 텍스처, 아늑하고 편안한 캐주얼 룩"
        situation-types: []
        outfit-direction: ""
        default-outfit: false
        enhance: true
      gray_hoodie:
        label: "그레이 후드"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/gray_hoodie.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/gray_hoodie.png"
        prompt: "그레이 컬러의 후드 집업, 캐주얼하고 편안한 스트릿 룩"
        situation-types: []
        outfit-direction: ""
        default-outfit: false
        enhance: true
      light_blue_shirt:
        label: "라이트 블루 셔츠"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/light_blue_shirt.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/light_blue_shirt.png"
        prompt: "라이트 블루 컬러의 셔츠, 산뜻하고 단정한 캐주얼 핏"
        situation-types: []
        outfit-direction: ""
        default-outfit: false
        enhance: true
      black_denim_jacket_white_tee:
        label: "블랙 데님 자켓"
        reference-image-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/black_denim_jacket_white_tee.png"
        thumbnail-url: "https://dg0nfh2xt4e4z.cloudfront.net/outfits/black_denim_jacket_white_tee.png"
        prompt: "블랙 데님 재킷과 화이트 티셔츠, 캐주얼하면서 개성 있는 스트릿 룩"
        situation-types: []
        outfit-direction: ""
        default-outfit: false
        enhance: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rehearsal?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:3306/rehearsal?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    user: root
    password: password
