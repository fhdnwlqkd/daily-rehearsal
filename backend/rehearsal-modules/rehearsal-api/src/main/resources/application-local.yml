spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rehearsal?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: password
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:3306/rehearsal?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
    user: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
