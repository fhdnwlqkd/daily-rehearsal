name: Deploy Backend

on:
  push:
    branches:
      - release/backend

defaults:
  run:
    working-directory: backend/rehearsal-modules

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests
        run: ./gradlew test --no-daemon

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f rehearsal-api/Dockerfile \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/rehearsal-modules/docker/docker-compose.prod.yml
          target: /opt/daily-rehearsal
          strip_components: 3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            cd /opt/daily-rehearsal
            umask 077
            cat > .env.backend <<'EOF'
            API_KEY=${{ secrets.API_KEY }}
            DEMO_API_KEY=${{ secrets.DEMO_API_KEY }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            GEMINI_ENABLED=${{ vars.GEMINI_ENABLED || 'true' }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DECART_ENABLED=${{ vars.DECART_ENABLED || 'true' }}
            DECART_API_KEY=${{ secrets.DECART_API_KEY }}
            VIDEO_STORAGE_PUBLIC_BASE_URL=${{ secrets.VIDEO_STORAGE_PUBLIC_BASE_URL }}
            TICKET_DOWNLOAD_PAGE_BASE_URL=${{ secrets.TICKET_DOWNLOAD_PAGE_BASE_URL || 'https://d1ay2vsnaftdcj.cloudfront.net' }}
            VIDEO_STORAGE_BUCKET=${{ secrets.VIDEO_STORAGE_BUCKET }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            ECR_IMAGE=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
            IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            EOF
            chmod 600 .env.backend
            docker compose --env-file .env.backend -f docker-compose.prod.yml pull app
            docker compose --env-file .env.backend -f docker-compose.prod.yml up -d app
            docker image prune -f
